{% extends "base.html" %}
{% block title %}Play Ludo - SILENT VENOM{% endblock %}

{% block content %}
<div style="background: #050e0a; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: sans-serif;">
    
    <!-- Top Header with Back Button -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #071912; border-bottom: 1px solid #143d2c;">
        <a href="{{ url_for('dashboard') }}" style="color: #f5c542; font-size: 16px; text-decoration: none; font-weight: bold;">
            ← Back
        </a>
        <span style="color: #f5c542; font-size: 16px; font-weight: bold;">LUDO KING</span>
        <span style="width: 48px;"></span>
    </div>

    <!-- Interactive Native Ludo Board Container -->
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b1f17; color: #fff; padding: 20px;">
        <div style="background: #071912; border: 2px solid #143d2c; border-radius: 12px; padding: 24px; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
            <h2 style="color: #f5c542; margin-bottom: 8px;">🎲 Ludo Arena</h2>
            <p id="turn-info" style="color: #8fa89d; font-size: 14px; margin-bottom: 20px;">Roll the dice to start your turn!</p>
            
            <div id="dice-display" style="font-size: 48px; margin-bottom: 20px; background: #0b1f17; border-radius: 8px; padding: 10px; border: 1px solid #143d2c;">
                🎲
            </div>

            <button onclick="rollDice()" style="background: #f5c542; color: #050e0a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%;">
                Roll Dice
            </button>
        </div>
    </div>
</div>

<script>
function rollDice() {
    const diceValues = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
    const randomRoll = Math.floor(Math.random() * 6);
    document.getElementById('dice-display').innerText = diceValues[randomRoll];
    document.getElementById('turn-info').innerText = `You rolled a ${randomRoll + 1}! Move your token.`;
}
</script>
{% endblock %}
