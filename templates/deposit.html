<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILENT VENOM - Home</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #020d08;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Frame Wrapper */
        .mobile-frame {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background-color: #051811;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            border-radius: 24px;
            border: 4px solid #134632;
            padding-bottom: 80px;
        }

        .mobile-frame::-webkit-scrollbar {
            display: none;
        }

        /* Top Header */
        .top-header {
            background-color: #04120d;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-text {
            color: #e5c158;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .balance-badge {
            background-color: #0b3425;
            border: 1px solid #1a573f;
            border-radius: 20px;
            padding: 3px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }
        .balance-badge .amount {
            color: #e5c158;
            font-weight: bold;
        }
        .plus-btn {
            background-color: #28a745;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            text-decoration: none;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            color: #28a745;
        }

        /* Banners & Ticker */
        .promo-banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #1a573f;
        }
        .ticker-bar {
            background-color: #072318;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.75rem;
            color: #8fae9e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
        }

        /* Game Categories */
        .cat-btn {
            background-color: #0a3022;
            border: 1px solid #134632;
            border-radius: 10px;
            padding: 6px 2px;
            text-align: center;
            color: #8fae9e;
            font-size: 0.7rem;
            text-decoration: none;
            display: block;
        }
        .cat-btn.active {
            background: linear-gradient(180deg, #1aa368 0%, #0a4f32 100%);
            color: #ffffff;
            font-weight: bold;
        }
        .cat-btn i {
            font-size: 1rem;
            display: block;
            margin-bottom: 2px;
        }

        /* Game Cards Grid */
        .section-title {
            color: #e5c158;
            font-size: 0.9rem;
            font-weight: bold;
            margin: 12px 0 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .game-card {
            background: #0d3b2a;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            text-align: center;
            border: 1px solid #1a573f;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .game-card img {
            width: 100%;
            height: 85px;
            object-fit: cover;
        }
        .game-card .title {
            font-size: 0.65rem;
            padding: 3px;
            color: #ffffff;
            font-weight: 600;
            background: #072318;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Bottom Nav Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #04120d;
            border-top: 1px solid #134632;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 6px 0 8px 0;
            z-index: 999;
        }
