{% extends 'base.html' %}

{% block title %}Dashboard - SILENT VENOM{% endblock %}

{% block content %}
<div class="page-banner">
    <h2>User Dashboard</h2>
    <p>Welcome back to SILENT VENOM</p>
</div>

<div class="form-container text-center py-4">
    <div class="card p-4 border-0 mb-4" style="background-color: var(--card-bg); border-radius: 12px;">
        <i class="bi bi-person-circle text-warning mb-2" style="font-size: 48px;"></i>
        <h4 class="text-white fw-bold">{{ current_user.phone }}</h4>
        <p class="text-muted mb-0" style="font-size: 13px;">Invite Code: <span class="text-warning">{{ current_user.invite_code }}</span></p>
    </div>

    <a href="{{ url_for('logout') }}" class="btn-gold mt-3">
        Logout
    </a>
</div>
{% endblock %}
