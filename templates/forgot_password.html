{% extends 'base.html' %}

{% block title %}Reset Password - SILENT VENOM{% endblock %}

{% block content %}
<div class="page-banner">
    <h2>Reset Password</h2>
    <p>Enter your phone number to reset password</p>
</div>

<div class="form-container">
    <div class="tab-pill">
        <i class="bi bi-key"></i> Password Recovery
    </div>

    <form action="{{ url_for('forgot_password') }}" method="POST">
        <!-- Phone Field -->
        <div class="form-group-custom">
            <label class="form-label-custom">
                <i class="bi bi-phone"></i> Registered Phone / Admin ID
            </label>
            <div class="input-box-custom">
                <input type="text" name="phone" placeholder="Enter phone number or 'admin'" required>
            </div>
        </div>

        <!-- New Password -->
        <div class="form-group-custom">
            <label class="form-label-custom">
                <i class="bi bi-lock"></i> New password
            </label>
            <div class="input-box-custom">
                <input type="password" id="new-pass" name="new_password" placeholder="Enter new password" required>
                <i class="bi bi-eye-slash toggle-password" id="toggle-new-pass" onclick="togglePasswordVisibility('new-pass', 'toggle-new-pass')"></i>
            </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group-custom">
            <label class="form-label-custom">
                <i class="bi bi-lock"></i> Confirm password
            </label>
            <div class="input-box-custom">
                <input type="password" id="confirm-pass" name="confirm_password" placeholder="Confirm new password" required>
                <i class="bi bi-eye-slash toggle-password" id="toggle-confirm-pass" onclick="togglePasswordVisibility('confirm-pass', 'toggle-confirm-pass')"></i>
            </div>
        </div>

        <div style="height: 20px;"></div>

        <!-- Submit Button -->
        <button type="submit" class="btn-gold">Reset Password</button>
    </form>

    <a href="{{ url_for('login') }}" class="btn-outline-custom">
        Back to <span>Login</span>
    </a>
</div>
{% endblock %}
